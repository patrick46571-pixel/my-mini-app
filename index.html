<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Mini App</title>
  
  <!-- Official Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 24px;
    }

    p {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    button {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      margin: 8px;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1 id="greeting">Hello!</h1>
  <p>This is a simple Telegram Mini App.</p>

  <button onclick="showAlert()">Show Alert</button>
  <button onclick="sendData()">Send Data to Bot</button>

  <script>
    // Make the Mini App ready
    Telegram.WebApp.ready();
    Telegram.WebApp.expand(); // Make it full height

    // Get user info
    const user = Telegram.WebApp.initDataUnsafe.user;
    if (user) {
      document.getElementById('greeting').innerText = `Hello, ${user.first_name}!`;
    }

    // Apply Telegram theme colors automatically
    document.body.style.backgroundColor = Telegram.WebApp.themeParams.bg_color || '#ffffff';
    document.body.style.color = Telegram.WebApp.themeParams.text_color || '#000000';

    function showAlert() {
      Telegram.WebApp.showAlert('This is a native Telegram alert!');
    }

    function sendData() {
      // Send data back to your bot
      Telegram.WebApp.sendData(JSON.stringify({
        action: 'button_clicked',
        message: 'User clicked the button'
      }));
      
      // Optional: close the Mini App after sending
      // Telegram.WebApp.close();
    }
  </script>
</body>
</html>
