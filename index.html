<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Tap to Jump</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10131c;
    font-family: Arial, sans-serif;
    touch-action: none;
    user-select: none;
}

#game {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(
        to bottom,
        #57c7ff 0%,
        #a8e7ff 70%,
        #d9f7ff 100%
    );
}

/* Top UI */

#topBar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.35);
}

.scoreBox {
    font-size: 22px;
    font-weight: bold;
}

.bestBox {
    font-size: 16px;
    font-weight: bold;
}

/* Clouds */

.cloud {
    position: absolute;
    width: 100px;
    height: 35px;
    background: rgba(255,255,255,0.85);
    border-radius: 30px;
    opacity: 0.8;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 45px;
    height: 45px;
    left: 15px;
    bottom: 5px;
}

.cloud::after {
    width: 55px;
    height: 55px;
    right: 12px;
    bottom: 3px;
}

.cloud1 {
    top: 18%;
    left: 10%;
}

.cloud2 {
    top: 30%;
    right: -20px;
    transform: scale(0.8);
}

.cloud3 {
    top: 10%;
    right: 25%;
    transform: scale(0.6);
}

/* Game Area */

#gameArea {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

/* Player */

#player {
    position: absolute;
    width: 42px;
    height: 42px;
    left: 70px;
    bottom: 120px;
    z-index: 10;
    background: #ffcc00;
    border: 4px solid #d99400;
    border-radius: 50%;
    box-shadow: 0 5px 0 #b87900;
}

#player::before {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    background: #222;
    border-radius: 50%;
    top: 10px;
    left: 9px;
    box-shadow: 15px 0 #222;
}

#player::after {
    content: "";
    position: absolute;
    width: 17px;
    height: 7px;
    border-bottom: 3px solid #222;
    border-radius: 50%;
    bottom: 7px;
    left: 8px;
}

/* Ground */

#ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100px;
    background: #52b848;
    border-top: 8px solid #3d922f;
    z-index: 5;
}

#ground::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 15px;
    top: 15px;
    left: 0;
    background: repeating-linear-gradient(
        90deg,
        #459f38 0px,
        #459f38 35px,
        #55b847 35px,
        #55b847 70px
    );
}

/* Obstacles */

.obstacle {
    position: absolute;
    bottom: 100px;
    width: 45px;
    background: #e74c3c;
    border: 4px solid #b72f24;
    border-radius: 8px 8px 0 0;
    z-index: 6;
}

/* Start Screen */

.screen {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
    background: rgba(10, 15, 30, 0.82);
    color: white;
}

.screen h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.screen p {
    font-size: 17px;
    margin-bottom: 25px;
    opacity: 0.9;
}

button {
    border: none;
    padding: 16px 45px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    background: #ffcc00;
    color: #222;
    box-shadow: 0 5px 0 #b87900;
    cursor: pointer;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #b87900;
}

.hidden {
    display: none !important;
}

/* Game Over */

#gameOver h1 {
    color: #ffcc00;
}

.finalScore {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 8px;
}

.bestScore {
    font-size: 18px;
    margin-bottom: 25px;
}

/* Tap Hint */

#tapHint {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    color: white;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 0 2px 4px black;
    pointer-events: none;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0%, 100% {
        opacity: 0.4;
        transform: translateX(-50%) scale(1);
    }

    50% {
        opacity: 1;
        transform: translateX(-50%) scale(1.08);
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="topBar">
        <div class="scoreBox">
            Score: <span id="score">0</span>
        </div>

        <div class="bestBox">
            Best: <span id="best">0</span>
        </div>
    </div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div id="gameArea">

        <div id="player"></div>

        <div id="tapHint">
            TAP TO JUMP
        </div>

        <div id="ground"></div>

    </div>

    <!-- Start Screen -->

    <div id="startScreen" class="screen">

        <h1>Tap to Jump</h1>

        <p>
            Tap anywhere to jump.<br>
            Avoid the obstacles and get the highest score.
        </p>

        <button id="startButton">
            PLAY
        </button>

    </div>

    <!-- Game Over Screen -->

    <div id="gameOver" class="screen hidden">

        <h1>GAME OVER</h1>

        <div class="finalScore">
            Score: <span id="finalScore">0</span>
        </div>

        <div class="bestScore">
            Best: <span id="finalBest">0</span>
        </div>

        <button id="restartButton">
            PLAY AGAIN
        </button>

    </div>

</div>

<script>

/* Telegram Mini App */

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    // Optional Telegram theme support
    document.body.style.backgroundColor =
        tg.themeParams?.bg_color || "#10131c";
}


/* Game Elements */

const game = document.getElementById("game");
const gameArea = document.getElementById("gameArea");
const player = document.getElementById("player");

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");

const finalScoreElement = document.getElementById("finalScore");
const finalBestElement = document.getElementById("finalBest");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const tapHint = document.getElementById("tapHint");


/* Game Variables */

let gameRunning = false;

let playerX = 70;
let playerY = 0;

let velocityY = 0;

let gravity = 0.65;
let jumpPower = -12;

let score = 0;

let bestScore =
    Number(localStorage.getItem("tapJumpBest")) || 0;

let obstacles = [];

let lastTime = 0;

let obstacleTimer = 0;

let obstacleInterval = 1500;

let gameSpeed = 5;


/* Update Best Score */

bestElement.textContent = bestScore;


/* Get Ground Height */

function getGroundHeight() {

    return 100;

}


/* Reset Player */

function resetPlayer() {

    playerX = 70;

    playerY =
        game.clientHeight -
        getGroundHeight() -
        player.offsetHeight;

    velocityY = 0;

    player.style.left = playerX + "px";

    player.style.top = playerY + "px";

}


/* Jump */

function jump() {

    if (!gameRunning) {
        return;
    }

    velocityY = jumpPower;

}


/* Create Obstacle */

function createObstacle() {

    const obstacle =
        document.createElement("div");

    obstacle.className = "obstacle";

    const height =
        Math.floor(
            Math.random() * 50
        ) + 45;

    obstacle.style.height =
        height + "px";

    obstacle.style.left =
        game.clientWidth + "px";

    obstacle.dataset.x =
        game.clientWidth;

    obstacles.push(obstacle);

    gameArea.appendChild(obstacle);

}


/* Remove Obstacles */

function clearObstacles() {

    obstacles.forEach(
        obstacle => obstacle.remove()
    );

    obstacles = [];

}


/* Collision Detection */

function collision(
    playerRect,
    obstacleRect
) {

    return !(
        playerRect.right <
        obstacleRect.left ||

        playerRect.left >
        obstacleRect.right ||

        playerRect.bottom <
        obstacleRect.top ||

        playerRect.top >
        obstacleRect.bottom
    );

}


/* End Game */

function endGame() {

    gameRunning = false;

    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
            "tapJumpBest",
            bestScore
        );

    }

    finalScoreElement.textContent =
        score;

    finalBestElement.textContent =
        bestScore;

    bestElement.textContent =
        bestScore;

    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* Start Game */

function startGame() {

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    clearObstacles();

    score = 0;

    scoreElement.textContent =
        score;

    obstacleTimer = 0;

    gameSpeed = 5;

    obstacleInterval = 1500;

    resetPlayer();

    gameRunning = true;

    tapHint.classList.remove(
        "hidden"
    );

    setTimeout(() => {

        tapHint.classList.add(
            "hidden"
        );

    }, 2500);

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* Game Loop */

function gameLoop(timestamp) {

    if (!gameRunning) {
        return;
    }

    const delta =
        timestamp - lastTime;

    lastTime =
        timestamp;


    /*
    Player Physics
    */

    velocityY +=
        gravity;

    playerY +=
        velocityY;


    const groundY =
        game.clientHeight -
        getGroundHeight() -
        player.offsetHeight;


    if (playerY >= groundY) {

        playerY =
            groundY;

        velocityY = 0;

    }


    player.style.top =
        playerY + "px";


    /*
    Create Obstacles
    */

    obstacleTimer +=
        delta;


    if (
        obstacleTimer >=
        obstacleInterval
    ) {

        createObstacle();

        obstacleTimer = 0;

        /*
        Gradually increase difficulty
        */

        if (
            obstacleInterval > 850
        ) {

            obstacleInterval -= 15;

        }

        if (
            gameSpeed < 11
        ) {

            gameSpeed += 0.05;

        }

    }


    /*
    Move Obstacles
    */

    const playerRect =
        player.getBoundingClientRect();


    obstacles.forEach(
        obstacle => {

            let x =
                Number(
                    obstacle.dataset.x
                );

            x -=
                gameSpeed *
                (delta / 16.67);

            obstacle.dataset.x =
                x;

            obstacle.style.left =
                x + "px";


            /*
            Collision
            */

            const obstacleRect =
                obstacle.getBoundingClientRect();


            if (
                collision(
                    playerRect,
                    obstacleRect
                )
            ) {

                endGame();

            }


            /*
            Score
            */

            if (
                x +
                obstacle.offsetWidth <
                playerX &&
                !obstacle.dataset.scored
            ) {

                obstacle.dataset.scored =
                    "true";

                score++;

                scoreElement.textContent =
                    score;

            }


            /*
            Remove old obstacles
            */

            if (
                x <
                -obstacle.offsetWidth
            ) {

                obstacle.remove();

            }

        }
    );


    /*
    Keep only active obstacles
    */

    obstacles =
        obstacles.filter(
            obstacle =>
                obstacle.parentElement
        );


    requestAnimationFrame(
        gameLoop
    );

}


/* Tap / Touch Controls */

game.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target === startButton ||
            event.target === restartButton
        ) {

            return;

        }

        jump();

    }
);


/* Keyboard Control */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }

    }
);


/* Start Button */

startButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        startGame();

    }
);


/* Restart Button */

restartButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        startGame();

    }
);


/* Resize */

window.addEventListener(
    "resize",
    function() {

        if (gameRunning) {

            const groundY =
                game.clientHeight -
                getGroundHeight() -
                player.offsetHeight;

            if (playerY > groundY) {

                playerY =
                    groundY;

            }

        }

    }
);


/* Initial Position */

resetPlayer();

</script>

</body>
    </html>
